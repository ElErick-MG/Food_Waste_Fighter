version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: foodwastefighter_db
    environment:
      MYSQL_ROOT_PASSWORD: "12345"
      MYSQL_DATABASE: "foodwastefighter"
    volumes:
      - ../init_database.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodwastefighter_app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
